[versions]
# The Kotlin this repo BUILDS with: the root build's plugins and runtime modules, the
# `compiler/` build's own `kotlin("jvm")`, and the standalone samples that sit on the KGP the
# published plugin pulls in (samples/minimal; samples/v8 via this catalog).
kotlin = "2.4.10"
# The Kotlin compiler API the FIR plugin jars COMPILE AGAINST: the consumer floor, deliberately
# behind `kotlin` above. The consumer's own kotlinc loads those jars, and its API is not stable
# across minors, so this is the oldest Kotlin a consumer may run. The Gradle plugin's
# MIN_KOTLIN_VERSION is generated from it, and samples/multiproject builds on exactly it as the
# floor's canary. Raising it raises the floor for every consumer, which is a policy decision,
# not a routine bump, so it does NOT follow `kotlin` (#225).
kotlin-api = "2.4.0"
coroutines = "1.11.0"
serialization = "1.10.0"
ksrpc = "1.1.4"
clikt = "5.1.0"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
klinker = "0.2.0"
gradle-plugin-publish = "2.1.1"
vannik = "0.37.0"
binary-compatibility-validator = "0.18.0"
shadow = "9.6.1"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ksrpc-core = { module = "com.monkopedia.ksrpc:ksrpc-core", version.ref = "ksrpc" }
ksrpc-sockets = { module = "com.monkopedia.ksrpc:ksrpc-sockets", version.ref = "ksrpc" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
# The `compiler/` build's compile-against Kotlin artifacts, requested at the floor. The two
# compiler jars resolve to exactly it. kotlin-gradle-plugin is aligned up to `kotlin` by KGP's
# BOM, through the kotlin-gradle-plugin-api the Gradle plugin declares at the build's version.
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin-api" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin-api" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin-api" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
ksrpc = { id = "com.monkopedia.ksrpc.plugin", version.ref = "ksrpc" }
klinker = { id = "com.monkopedia.klinker.plugin", version.ref = "klinker" }
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-plugin-publish" }
vannik-publish = { id = "com.vanniktech.maven.publish", version.ref = "vannik" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
