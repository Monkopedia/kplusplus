# Release: publish the kplusplus v2 artifact set outward.
#
#   * The Gradle plugin (com.monkopedia.kplusplus.compiler) -> the Gradle Plugin Portal
#     AND the Central Portal (so both `gradlePluginPortal()` and `mavenCentral()` consumers
#     resolve `id("...") version "..."`). The `krapper` native tool binary is BUNDLED INSIDE
#     this plugin jar (0.4.0 model), not shipped as a separate coordinate.
#   * The FIR kotlinc-plugin jar -> the Central Portal.
#
# Everything is GPG-signed (vanniktech in-memory key) and uploaded to the Central Portal, which
# AUTO-RELEASES the deployment once it passes validation (automaticRelease = true; a bundle that
# fails validation is not released). See docs/releasing.md for the GitHub Secrets + cut steps.
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `gradle/actions/setup-gradle` used to sit below the JDK setup. It is gone: its v6 moved
      # caching into `gradle-actions-caching`, a proprietary non-MIT component whose Terms of Use
      # you accept by upgrading, and this repo declines that everywhere (compiler-check.yml and
      # root-build.yml were already written this way). Two things it actually did for us survive
      # the removal, and they are split apart here.
      #
      # (1) Wrapper validation, which setup-gradle did by default (`validate-wrappers: true`) —
      # so removing it without this line would have quietly weakened the RELEASE path, the one
      # place in this repo where an unvalidated wrapper jar reaches signed, published artifacts.
      # The standalone sub-action is MIT-only: `dist/wrapper-validation/main/index.js` at v6.3.0
      # contains zero occurrences of `gradle-actions-caching`, where setup-gradle's contains one.
      # It runs before the JDK setup because the point is to validate the jar before anything
      # executes it.
      - name: Validate the Gradle wrapper jars
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # (2) Gradle User Home caching — and this one is deliberately NOT reinstated, unlike in the
      # other three workflows. GitHub scopes an Actions cache by ref. This workflow runs only on
      # `release: published` (ref = the tag) and `workflow_dispatch`, so it never writes a cache
      # any later run can read, and there is no push-to-main run of THIS workflow to warm one for
      # it. setup-gradle's `cache-read-only` default (`ref_name != default_branch`) already made
      # it read-only here for exactly that reason. An actions/cache step would be decoration, so
      # there isn't one; a release is not latency-sensitive, and the job pays a ~1 GB Kotlin/Native
      # download anyway.

      # #222: the release path used to be LESS gated than a pull request. compiler-check.yml
      # (#210) runs `-p compiler check` on every PR — apiCheck on BOTH published ABIs,
      # verifyConsumedPluginPins (#192), and the compiler build's own tests — but this workflow
      # went straight from checkout to publish, so at release time that gate was simply skipped.
      # The plugin published below CARRIES the bundled krapper binary (docs/releasing.md), i.e.
      # the artifact every consumer runs was shipped past a gate its own PRs must pass. Run it
      # here too, FIRST: `compiler/` is a separate, JVM-only Gradle build (no LLVM, no
      # Kotlin/Native), so this is the cheapest possible thing to fail on and it fails before
      # the LLVM install below costs anything.
      #
      # Delete-before-measure + a non-zero-count assert, the #198 pattern: a green `check` is
      # not evidence tests ran, and stale JUnit XML in a re-run workspace sits exactly where a
      # verifier looks. The clear glob below and the assert glob further down are deliberately
      # the SAME depth (`compiler/<module>/build/test-results`) — compiler-check.yml clears one
      # level but asserts over `compiler/**`, which also matches the root project's own
      # `compiler/build/test-results`, so stale XML there is read but never cleared. Inert
      # there (the compiler root has no tests) and tracked in #230; not reproduced here.
      - name: Clear stale test reports
        run: rm -rf compiler/*/build/test-results

      - name: Gate the release on -p compiler check
        run: ./gradlew -p compiler check --no-daemon

      # PER MODULE, not summed. A grand total across `compiler/**` passes when a whole test
      # module's report vanishes (task rename, source-set change, a `check` wiring edit) as long
      # as some OTHER module still reports: `compiler/plugin` holds BindingIndexCoverageTest,
      # the #186/B2 gate that every binding name comes out of krapper's index (#206), and losing
      # just that one still counts 3 tests from `compiler/gradle` and publishes green. On the release path the blast radius of that
      # is every consumer, so each module is asserted on its own.
      #
      # And the module list is DISCOVERED from the source tree, never hardcoded — a hardcoded
      # pair is an enumeration that cannot report its own gap (#231): add
      # `compiler/native/src/test` and a literal `for mod in compiler/gradle compiler/plugin`
      # would silently not require it, which is the same defect one level up. Discovery fails
      # closed: no test module found at all is itself a gap and fails the gate.
      - name: Assert the compiler check actually ran tests
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mods=(compiler/*/src/test)
          if [ ${#mods[@]} -eq 0 ]; then
            echo "::error::Found no compiler/*/src/test source tree at all. Either the layout moved (this guard needs updating) or the tests are gone; refusing to publish either way."
            exit 1
          fi
          mods=("${mods[@]%/src/test}")
          echo "gating on ${#mods[@]} test module(s): ${mods[*]}"
          # `tests=` COUNTS SKIPPED TESTCASES. An all-skipped suite reports a perfectly
          # healthy tests="N" with failures=0 errors=0, and it measured nothing just as
          # surely as an empty one — which is the exact hole this gate exists to close
          # (Refs #198, Refs #222, Refs #230). The executed count is `tests - skipped`;
          # both attributes sit on the same <testsuite> element.
          #
          # Sum EVERY <testsuite> rather than reading `head -1`. The failure and error
          # counts were extracted the same way, so a second suite carrying a failure was
          # silently dropped — that one turns a red build green. Gradle happens to write
          # one suite per file today (both `test` and `nativeTest`), but a gate should be
          # right by construction, not by a property of the current report writer.
          #
          # Reading the `<testsuite ...>` start tag rather than the whole file keeps
          # attribute-looking text inside a <system-out> block from being counted, and the
          # literal space after `testsuite` excludes any `<testsuites>` aggregate wrapper,
          # whose totals would otherwise be added on top of the children they summarise.
          sum_attr() { # <file> <attr> -> summed over every <testsuite> element in the file
            grep -o '<testsuite [^>]*>' "$1" | grep -o " $2=\"[0-9]*\"" \
              | grep -o '[0-9]*' | awk '{ n += $1 } END { print n + 0 }' || true
          }
          grand=0
          for mod in "${mods[@]}"; do
            xml=("$mod"/build/test-results/**/*.xml)
            if [ ${#xml[@]} -eq 0 ]; then
              echo "::error::No JUnit XML under $mod/build/test-results, though $mod/src/test exists. That module's tests cannot have run, so this release would publish past a gate that skipped them."
              exit 1
            fi
            reported=0; skipped=0; failed=0
            for f in "${xml[@]}"; do
              reported=$((reported + $(sum_attr "$f" tests)))
              skipped=$((skipped + $(sum_attr "$f" skipped)))
              failed=$((failed + $(sum_attr "$f" failures) + $(sum_attr "$f" errors)))
            done
            executed=$((reported - skipped))
            echo "$mod: $executed test(s) executed ($reported reported, $skipped skipped), $failed failure(s)/error(s) across ${#xml[@]} report file(s)"
            if [ "$executed" -eq 0 ]; then
              echo "::error::$mod EXECUTED zero tests ($reported reported, $skipped skipped). Refusing to publish on a gate that ran nothing."
              exit 1
            fi
            if [ "$failed" -ne 0 ]; then
              echo "::error::$mod reported test failures. Not publishing."
              exit 1
            fi
            grand=$((grand + executed))
          done
          echo "compiler build: $grand test(s) executed across ${#mods[@]} module(s)"

      # :krapper regenerates its own Clang-AST bindings with the tool bundled in the last
      # released plugin. The generated wrapper #includes <clang/AST/...> and is built against
      # LLVM 22 — it only compiles against LLVM 22 (the cross-major C++ API drift proven in the
      # portability probe), and apt.llvm.org puts those headers under /usr/lib/llvm-22/include,
      # NOT the distro default path. So install LLVM 22 from apt.llvm.org (not the distro's
      # clang) and surface its include/lib dirs via CPATH/LD_LIBRARY_PATH so the wrapper
      # compile, the klinker link, and runtime all resolve. LLVM is a hard requirement — the
      # settings probe reads the LLVM major + libdir from llvm-config and fails fast if absent.
      - name: Install LLVM/Clang 22 (apt.llvm.org)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg ca-certificates software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          sudo ln -sf "$(command -v clang++-22)"     /usr/local/bin/clang++
          sudo ln -sf "$(command -v clang-22)"       /usr/local/bin/clang
          sudo ln -sf "$(command -v llvm-config-22)" /usr/local/bin/llvm-config
          echo "clang++: $(clang++ --version | head -1); llvm-config: $(llvm-config --version)"
          echo "CPATH=$(llvm-config --includedir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      # Build the native tool binary so the publish steps can BUNDLE it into the plugin jar
      # (the 0.4.0 distribution model — the released plugin carries its own tool; consumers no
      # longer resolve a separate coordinate). :krapper is always in the build (LLVM is a hard
      # requirement) and links against the LLVM installed above.
      - name: Build the tool binary (to bundle into the plugin)
        run: >-
          ./gradlew :krapper:linkReleaseExecutableKlinker --no-configuration-cache

      # --- Publish the Gradle plugin (tools bundled) to the Gradle Plugin Portal ---
      # publishPlugins uses gradle.publish.key / gradle.publish.secret. Runs ONLY on an actual
      # release event: the Plugin Portal rejects re-publishing an existing version, so a manual
      # workflow_dispatch re-run (e.g. to retry a failed Central upload) skips this step and does
      # Central only. -Pkpp.bundleTools.krapper=<abs-path> packs the just-built binary into the
      # plugin jar (see compiler/gradle/build.gradle.kts + extractBundledTool in the plugin).
      - name: Publish Gradle plugin to the Plugin Portal
        if: github.event_name == 'release'
        run: >-
          ./gradlew -p compiler :kplusplus-compiler-gradle:publishPlugins
          -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }}
          -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}
          -Pkpp.bundleTools.krapper=$GITHUB_WORKSPACE/krapper/build/bin/klinker/krapperRelease/krapper

      # --- Publish the plugin set (tools bundled) to the Central Portal (auto-released) ---
      # `-p compiler publishToMavenCentral` uploads ONLY the compiler build's coordinates — the
      # Gradle plugin (+ marker) and the FIR plugin jar — as one signed bundle. The native tool
      # binary rides INSIDE the plugin jar (bundleTools), so there are NO standalone tool
      # Central artifacts anymore (that whole classified-binary path is gone — it was the source
      # of the 0.3.0 firefight). vanniktech reads the Portal token + the in-memory GPG key from
      # the ORG_GRADLE_PROJECT_* env vars below.
      - name: Publish to the Central Portal (auto-release on validation)
        env:
          # Reuse the EXISTING repo secrets (from the v1 pipeline). The Central Portal user token
          # (central.sonatype.com) maps onto the OSSRH_USERNAME/OSSRH_TOKEN pair; OSSRH_GPG_SECRET_KEY
          # is the same armored key v1 used.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: >-
          ./gradlew -p compiler publishToMavenCentral --no-configuration-cache
          -Pkpp.bundleTools.krapper=$GITHUB_WORKSPACE/krapper/build/bin/klinker/krapperRelease/krapper

      - name: Release notes
        run: |
          echo "Published the kplusplus plugin set (native tool bundled in the plugin jar) to"
          echo "the Central Portal (auto-released on validation) and the Gradle Plugin Portal."
          echo "Check status at https://central.sonatype.com (Deployments)."
