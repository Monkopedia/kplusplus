# Guard for #195: samples/minimal is a from-published consumer (it resolves the
# released kplusplus plugin from mavenCentral/gradlePluginPortal, not the in-tree
# generator — see samples/minimal/README.md), so it cannot catch a generated-shape
# change at the moment the generator changes. The only moment it CAN catch one is
# when this sample itself next builds against a plugin version — which is exactly
# what silently broke here: the context-parameter migration (#145/#146) changed
# `origin` from a property to `origin()`/`_origin(v)` accessors, and nothing ran
# `samples/minimal:nativeTest` to notice until the 0.3.4 self-host bump (#193).
#
# This workflow closes that gap: any PR/push that touches samples/minimal (most
# notably a plugin-version bump in samples/minimal/build.gradle.kts, which is
# precisely the trigger that caused #195) runs `:nativeTest`, which forces
# src/nativeMain to compile AND exercises the generated bindings' behavior
# (src/nativeTest/kotlin/GeometryTest.kt). A shape drift fails the compile step
# loudly, the same way it did when this was reproduced by hand for #195.
#
# Deliberately NOT wired into the root build / release.yml: samples/minimal is
# explicitly not part of the root settings.gradle.kts (it's a standalone,
# from-published consumer proving the published artifact, not the in-tree one —
# see docs/ARCHITECTURE.md), and this workflow doesn't need the in-tree LLVM-linked
# :krapper build at all, so it's cheap and independent of the main build's slower
# self-hosting path.
name: samples/minimal

on:
  push:
    branches: [main]
    paths:
      - 'samples/minimal/**'
      - '.github/workflows/samples-minimal.yml'
      - '.github/actions/konan-cache/**'
      - '.github/test-evidence-gate/gate.sh'
  pull_request:
    paths:
      - 'samples/minimal/**'
      - '.github/workflows/samples-minimal.yml'
      - '.github/actions/konan-cache/**'
      - '.github/test-evidence-gate/gate.sh'
  workflow_dispatch:

jobs:
  native-test:
    runs-on: ubuntu-latest
    # The job normally takes ~2 minutes; without this it inherits GitHub's 360-minute
    # cap, so a wedged run could sit for six hours before anyone notices (#198).
    timeout-minutes: 15
    env:
      TEST_MODULES: samples/minimal
    steps:
      - uses: actions/checkout@v7

      # This is what `gradle/actions/setup-gradle` was silently giving us: `validate-wrappers`
      # defaults to true on it, so dropping setup-gradle without this would have quietly removed
      # the checksum gate on every `gradle-wrapper.jar` in the tree. Kept as the standalone
      # sub-action, which is MIT-only: v6 moved caching into `gradle-actions-caching`, a
      # proprietary non-MIT component, but ONLY into setup-gradle's bundle —
      # `dist/wrapper-validation/main/index.js` at v6.3.0 contains zero occurrences of
      # `gradle-actions-caching` (setup-gradle's contains one). Run before, not after, the JDK
      # setup: the point is to validate the jar before anything executes it.
      - name: Validate the Gradle wrapper jars
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Replaces the Gradle User Home caching that setup-gradle used to do here, with the
      # first-party actions/cache pattern root-build.yml already uses. setup-gradle's v6 caching
      # is the proprietary component described above; rather than answer the licence question
      # (`cache-provider: basic` would have), this dissolves it — no gradle.com Terms of Use are
      # accepted anywhere in this repo. `caches` + `wrapper` is a superset of setup-gradle's own
      # `gradle-home-cache-includes` default (`caches`, `notifications`). What is genuinely lost
      # is setup-gradle's cache cleanup/dedup and its job summary; neither is load-bearing.
      # `main` writes the cache on push, PRs restore it via the prefix key.
      - name: Cache the Gradle user home
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-samples-minimal-${{ runner.os }}-${{ hashFiles('samples/minimal/**/*.gradle.kts', 'samples/minimal/gradle.properties', 'samples/minimal/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-samples-minimal-${{ runner.os }}-

      # samples/minimal pins its own Kotlin version in its plugins block, not in the root
      # catalog, so the composite action is pointed there. A pin below the KGP the kplusplus
      # plugin brings loses resolution to it; the assert after the build catches that (#276).
      - name: Cache the Kotlin/Native distribution
        id: konan
        uses: ./.github/actions/konan-cache
        with:
          version-file: samples/minimal/build.gradle.kts
          version-sed: 's/^ *kotlin("multiplatform") version "\(.*\)"$/\1/p'

      # The published krapper tool binary is LLVM-linked and needs clang++ on PATH at
      # RUNTIME to parse cpp/geometry.h and compile it (see samples/minimal/README.md
      # "Requirements") — no in-tree LLVM build required, unlike release.yml.
      - name: Install LLVM/Clang 22 (apt.llvm.org)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg ca-certificates software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          sudo ln -sf "$(command -v clang++-22)"     /usr/local/bin/clang++
          sudo ln -sf "$(command -v clang-22)"       /usr/local/bin/clang
          sudo ln -sf "$(command -v llvm-config-22)" /usr/local/bin/llvm-config
          echo "clang++: $(clang++ --version | head -1); llvm-config: $(llvm-config --version)"

      # Delete-before-measure (#198); see gate.sh. This site used to lack it (#247).
      - name: Clear stale test reports
        run: bash .github/test-evidence-gate/gate.sh clear "$TEST_MODULES"

      - name: samples/minimal :nativeTest
        working-directory: samples/minimal
        run: ./gradlew nativeTest --no-daemon

      # #276: konan-cache's init script fails the build on a KGP version it did not key on.
      # This catches the rest: KGP provisioning that version somewhere other than the home the
      # action checks, which would leave the cache silently unused.
      - name: Assert KGP provisioned the version the cache is keyed on
        env:
          KONAN_HOME: ${{ steps.konan.outputs.home }}
        run: |
          if [ ! -f "$KONAN_HOME/provisioned.ok" ]; then
            found=(~/.konan/kotlin-native-prebuilt-*)
            echo "::error::KGP did not provision $KONAN_HOME; it provisioned ${found[*]}. Point konan-cache at the Kotlin version the build really uses."
            exit 1
          fi

      # #198: a Test task with no matching sources succeeds silently, so a green step above
      # is NOT proof anything ran. This is the actual guarantee; the artifact upload below is
      # just evidence for a human who wants to double check.
      - name: Assert nativeTest actually ran tests
        if: always()
        run: bash .github/test-evidence-gate/gate.sh assert "$TEST_MODULES"

      - name: Upload nativeTest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: samples-minimal-native-test-results
          path: samples/minimal/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
