# Closes #210: the two coordinates this project PUBLISHES had their tests run by
# nothing.
#
# `compiler/` is a SEPARATE Gradle build, deliberately not an `includeBuild` of the
# root (settings.gradle.kts:9-15 explains why — a composite would substitute our own
# coordinates and block :krapper from resolving a published tool). A consequence
# nobody had noticed: root tasks never reach it, and the only `-p compiler`
# invocations anywhere in CI were `publishPlugins` and `publishToMavenCentral`. So
# `:kplusplus-compiler-gradle`'s three tests, and `apiCheck` — the ABI gate on both
# published artifacts — ran only when someone happened to run them locally.
#
# That is the same never-executed shape as #198, one layer further out: there the
# job ran and could report zero tests; here the job did not exist at all.
#
# Cheap to run: both published modules are plain `kotlin("jvm")`, so this needs a
# JDK and nothing else. No LLVM, no Kotlin/Native, no klinker — unlike release.yml
# (which builds the LLVM-linked :krapper) and unlike samples-minimal.yml (which
# needs clang++ at runtime for the bundled tool). It is the cheapest job in the repo.
name: compiler check

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'krapper/src/commonMain/**'      # compiled INTO the plugin as a shared source dir
      - 'krapper_model/src/commonMain/**'
      # NOTE: `krapper/src/nativeMain/.../WrappedKotlinType.kt` used to be pinned here, because
      # BindingNameManglingTest cross-checked the FIR plugin's hand copy of `mangleToIdentifier`
      # against that exact file. #186/B2 deleted the hand copy — the plugin now reads binding
      # names out of krapper's emitted `binding-index.json` — so nothing under `compiler/**`
      # depends on that source any more and the pin has been removed with the test. The gate
      # that replaced it (BindingIndexCoverageTest) reads featuregen's committed
      # `krapped/requested.txt` + `featuregen/build.gradle.kts`, pinned below.
      - 'featuregen/krapped/requested.txt'
      - 'featuregen/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradlew'                        # this job runs the repo-root ./gradlew
      - 'gradle/wrapper/**'
      - 'gradle.properties'              # the single source of the published version (#192)
      # `check` depends on verifyConsumedPluginPins (#192), which reads these four files out
      # of the REPO ROOT by relative path (compiler/gradle/build.gradle.kts) and asserts
      # they agree with the declared version. Without them here the gate is armed and then
      # filtered off every PR that could trip it: PR #205 -- the post-release pin migration,
      # whose entire content was three of these pins -- has ZERO overlap with the rest of this list
      # and would not have run this job.
      - 'settings.gradle.kts'
      - 'samples/minimal/build.gradle.kts'
      - 'samples/multiproject/bindings/build.gradle.kts'
      - 'docs/getting-started.md'        # the quickstart pin (#218)
      # verify.sh (below) reads its fixtures and EVERY `.github/workflows/*.yml` — so a new
      # workflow is covered by the glob, not by someone remembering to list it (#230).
      - '.github/test-evidence-gate/**'
      - '.github/workflows/*.yml'
      # This list cannot report its own gaps, so `-p compiler check` does it:
      # verifyCompilerCheckPaths (compiler/build.gradle.kts) fails when a file the check
      # reads from outside `compiler/**` is matched by no entry here (#230).
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole job is a JVM compile plus three tests; if it is anywhere near this
    # it is wedged, not slow. Same reasoning as #198's cap on samples-minimal.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # This job deliberately does not use gradle/actions/setup-gradle: its v6 moved caching
      # into `gradle-actions-caching`, a proprietary non-MIT component whose Terms of Use a
      # workflow accepts merely by upgrading. That question was open in #209 when this file
      # was written, which is why the job ran the wrapper directly and forwent caching
      # entirely, with a note to add it once #209 settled. #209 settled it by declining the
      # component repo-wide, so the caching this file was waiting on is here — first-party
      # actions/cache, the same pattern root-build.yml uses. `main` writes it on push, PRs
      # restore it via the prefix key. A miss just means the dependencies are re-downloaded.
      # `compiler/` resolves the ROOT version catalog (compiler/settings.gradle.kts:17), so
      # that file is part of the key.
      - name: Cache the Gradle user home
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-compiler-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'compiler/**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-compiler-${{ runner.os }}-

      # Executable evidence for the JUnit-XML arithmetic every gate in this repo uses
      # (.github/test-evidence-gate/). An all-skipped suite must read as zero executed,
      # a <testsuites> wrapper must not be double-counted, a failure in a second suite
      # must not be dropped, and a test that ERRORED must not be swallowed. It
      # also pins all five gate sites to the tested form, runs each gate's own
      # `executed = reported - skipped` arithmetic in situ, and runs each gate's own
      # guards on past that to judge the EXIT STATUS -- so a gate that stops
      # subtracting `skipped`, stops adding `errors`, or keeps the `::error::` and
      # loses the `exit 1` fails here rather than shipping green.
      # Runs in about a second and needs nothing but bash, so it sits in the cheapest
      # job in the repo and covers the gates in the three workflows it cannot run.
      - name: Verify the test-evidence gate arithmetic
        run: bash .github/test-evidence-gate/verify.sh

      # Delete-before-measure: a task that does not run leaves any previous
      # report exactly where the guard below looks, so "never ran" and "ran and
      # passed" are indistinguishable on disk. On a fresh checkout there is
      # nothing to delete; this matters on a re-run of a cached workspace.
      - name: Clear stale test reports
        run: rm -rf compiler/*/build/test-results

      - name: -p compiler check
        run: ./gradlew -p compiler check --no-daemon

      # A green `check` is not evidence tests ran: a task-name typo, a NO-SOURCE
      # source set, or an up-to-date task all report success having executed
      # nothing, and the JUnit XML from a PREVIOUS run persists where a verifier
      # looks. #198 was exactly this on the other workflow. So: delete the reports
      # first (in the step before), then assert they exist and are non-empty.
      #
      # PER MODULE, not summed (#230), and the module list is DISCOVERED from the source
      # tree — the same shape and reasoning as release.yml's copy of this gate. A grand
      # total stays green when `:kplusplus-compiler-plugin:test` stops reporting at all,
      # because `compiler/gradle`'s tests still count.
      - name: Assert the tests actually ran
        if: always()
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mods=(compiler/*/src/test)
          if [ ${#mods[@]} -eq 0 ]; then
            echo "::error::Found no compiler/*/src/test source tree at all. Either the layout moved (this guard needs updating) or the tests are gone."
            exit 1
          fi
          mods=("${mods[@]%/src/test}")
          echo "gating on ${#mods[@]} test module(s): ${mods[*]}"
          # `tests=` COUNTS SKIPPED TESTCASES. An all-skipped suite reports a perfectly
          # healthy tests="N" with failures=0 errors=0, and it measured nothing just as
          # surely as an empty one — which is the exact hole this gate exists to close
          # (Refs #198, Refs #222, Refs #230). The executed count is `tests - skipped`;
          # both attributes sit on the same <testsuite> element.
          #
          # Sum EVERY <testsuite> rather than reading `head -1`. The failure and error
          # counts were extracted the same way, so a second suite carrying a failure was
          # silently dropped — that one turns a red build green. Gradle happens to write
          # one suite per file today (both `test` and `nativeTest`), but a gate should be
          # right by construction, not by a property of the current report writer.
          #
          # Reading the `<testsuite ...>` start tag rather than the whole file keeps
          # attribute-looking text inside a <system-out> block from being counted, and the
          # literal space after `testsuite` excludes any `<testsuites>` aggregate wrapper,
          # whose totals would otherwise be added on top of the children they summarise.
          sum_attr() { # <file> <attr> -> summed over every <testsuite> element in the file
            grep -o '<testsuite [^>]*>' "$1" | grep -o " $2=\"[0-9]*\"" \
              | grep -o '[0-9]*' | awk '{ n += $1 } END { print n + 0 }' || true
          }
          grand=0
          for mod in "${mods[@]}"; do
            xml=("$mod"/build/test-results/**/*.xml)
            if [ ${#xml[@]} -eq 0 ]; then
              echo "::error::No JUnit XML under $mod/build/test-results, though $mod/src/test exists. That module's tests cannot have run, so this job would be green having skipped them."
              exit 1
            fi
            reported=0; skipped=0; failed=0
            for f in "${xml[@]}"; do
              reported=$((reported + $(sum_attr "$f" tests)))
              skipped=$((skipped + $(sum_attr "$f" skipped)))
              failed=$((failed + $(sum_attr "$f" failures) + $(sum_attr "$f" errors)))
            done
            executed=$((reported - skipped))
            echo "$mod: $executed test(s) executed ($reported reported, $skipped skipped), $failed failure(s)/error(s) across ${#xml[@]} report file(s)"
            if [ "$executed" -eq 0 ]; then
              echo "::error::$mod EXECUTED zero tests ($reported reported, $skipped skipped). This job would otherwise be green having run nothing — failing explicitly."
              exit 1
            fi
            if [ "$failed" -ne 0 ]; then
              echo "::error::$mod reported test failures."
              exit 1
            fi
            grand=$((grand + executed))
          done
          echo "compiler build: $grand test(s) executed across ${#mods[@]} module(s)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-check-test-results
          path: compiler/**/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
