# Closes #222: the ROOT Gradle build ran in no workflow at all.
#
# #210 fixed this for the two published JVM coordinates (compiler-check.yml). This is the
# same hole one layer out and much larger: `krapper` (THE TOOL, whose binary is bundled into
# the published plugin), `krapper_model`, `featuregen` (docs/ARCHITECTURE.md calls it "the
# primary correctness harness"), `feature-tests` and `cppfixture` — 566 `@Test`s across 122
# files — plus every `ktlintCheck` the root build.gradle.kts configures, ran only when a human
# happened to run them locally. A PR touching only `featuregen/` or `krapper/src/nativeMain`
# triggered NO workflow and merged green having executed nothing. That is the direct cause of
# the pattern this repo keeps re-discovering after the fact: #16, #194, #195.
#
# WHY TWO JOBS. The split is the task graph's own, not an arbitrary one:
#
#   * `unit-tests` runs the suites that do NOT need the in-tree tool. `:krapper:nativeTest`
#     reaches `kplusplusSync` (its clang-AST bindings, generated by the tool bundled in the
#     LAST released plugin) and then a DEBUG test link — no release link. `:krapper_model` is
#     plain K/N, `:feature-tests` is plain cinterop over a clang++-compiled archive.
#     `:clangwalk` is `kpp.frontend.clangwalk=seed` (a recompile of its committed bindings, no
#     tool run), so its walk of a real Clang AST rides here too (#245).
#   * `generator-suite` runs everything that goes through the IN-TREE tool. `:featuregen` and
#     `:cppfixture` are `kpp.frontend.*=cpp`, so their graphs pull
#     `:krapper:linkReleaseExecutableKlinker` — a full K/N RELEASE link of the LLVM-linked
#     binary, the single most expensive thing in the repo.
#
# So the second job is where the money is, and it is also why `:krapper:noncopyableDeterminismCheck`
# (the #101 lock, now a `dependsOn` of `:krapper:check` — krapper/build.gradle.kts) rides here:
# it needs that same release binary, which this job has already paid for. Running the two in
# parallel makes PR latency max(job), not sum(job).
#
# LLVM 22 is a HARD requirement of this build — settings.gradle.kts probes the toolchain
# UNCONDITIONALLY at settings-eval and fails fast if it is absent, so EVERY root Gradle
# invocation here needs it, `ktlintCheck` included. There is no `-PenableClang` flag; that
# opt-in was removed. The install block below is the one release.yml already uses.
name: root build

on:
  pull_request:
    paths:
      - 'krapper/**'
      - 'krapper_model/**'
      - 'featuregen/**'
      - 'feature-tests/**'
      - 'cppfixture/**'
      - 'clangwalk/**'          # built, linted and run by the unit-tests job (#245)
      - 'gradle/**'             # version catalog + the wrapper this runs
      - 'gradlew'
      - 'build.gradle.kts'      # configures ktlint across every subproject
      - 'settings.gradle.kts'   # the LLVM probe + the pinned consumed plugin version
      - 'gradle.properties'     # kpp.frontend.* per-module front ends, daemon heap
      # ktlint reads it, so it can fail every ktlintCheck in the build by itself: setting
      # max_line_length=40 fails :cppfixture:ktlintCheck in 6s, and without this line a PR
      # containing only that edit would trigger no workflow at all.
      - '.editorconfig'
      # #251: krapper's DefWriterGoldenTest (:krapper:nativeTest) compares DefWriter's output to
      # this fixture, a declared input of that task. It lives under compiler/, so without this
      # line a PR changing only the golden ran just the JVM reader test and merged green.
      - 'compiler/gradle/src/test/resources/defwriter-golden.def'
      # #237: generator-suite runs the compiler build's spelling gate — the in-tree plugin's
      # cppSpec against the index the in-tree krapper emits — so the plugin and that build's
      # scripts trigger this workflow too. verifyWorkflowPaths checks that invocation as well.
      - 'compiler/plugin/**'
      - 'compiler/**/*.gradle.kts'
      - '.github/workflows/root-build.yml'
      - '.github/actions/konan-cache/**'
      - '.github/actions/gradle-cache/**'
      - '.github/test-evidence-gate/gate.sh'
      # #223: :feature-tests:matrixReport (generator-suite) stamps this file from the tests and
      # proves its own verdicts on these fixtures first.
      - 'docs/features.md'
      - '.github/test-evidence-gate/fixtures/**'
  # Unfiltered on main, same as compiler-check.yml: a merge should always leave a full
  # root-build signal on the branch, whatever the merge happened to touch.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: krapper / krapper_model / feature-tests / clangwalk + ktlint
    runs-on: ubuntu-latest
    # No release link in this job's graph (see the header), but it is still a Kotlin/Native
    # compile plus a cinterop of the ~60-entry clang slice. Well past this and it is wedged,
    # not slow — the same reasoning as #198's cap on samples-minimal.
    timeout-minutes: 60
    env:
      TEST_MODULES: krapper krapper_model feature-tests
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Every dependency, otherwise fetched from Maven Central and the Plugin Portal on every
      # run, where a 429 or a truncated POM failed configuration (#331).
      - name: Cache Gradle's dependency cache
        uses: ./.github/actions/gradle-cache
        with:
          name: root-unit-tests

      # The Kotlin/Native distribution is a ~1 GB download that is identical for every run of
      # a given Kotlin version, and it is the largest fixed cost in a cold root build. This is
      # first-party actions/cache, deliberately NOT gradle/actions/setup-gradle — whose v6
      # moved caching into a proprietary, non-MIT component (#209 declined it repo-wide). The
      # composite action also points KGP at the restored copy; see it for why that is needed.
      - name: Cache the Kotlin/Native distribution
        id: konan
        uses: ./.github/actions/konan-cache

      - name: Install LLVM/Clang 22 (apt.llvm.org)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg ca-certificates software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          sudo ln -sf "$(command -v clang++-22)"     /usr/local/bin/clang++
          sudo ln -sf "$(command -v clang-22)"       /usr/local/bin/clang
          sudo ln -sf "$(command -v llvm-config-22)" /usr/local/bin/llvm-config
          echo "clang++: $(clang++ --version | head -1); llvm-config: $(llvm-config --version)"
          echo "CPATH=$(llvm-config --includedir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      # Delete-before-measure (#198); see gate.sh.
      - name: Clear stale test reports
        run: bash .github/test-evidence-gate/gate.sh clear "$TEST_MODULES"

      # The nativeTest tasks are built from TEST_MODULES, the list the gate asserts, so a
      # module cannot be run without being gated or gated without being run.
      # `:clangwalk:runDebugExecutableKlinker` is the clang runbook's stage1 walk: an Exec of a
      # binary that asserts its own walk and exits non-zero on any failed check, so it is not a
      # test suite and not in TEST_MODULES; its exit status fails this step directly (#245).
      - name: nativeTest (krapper, krapper_model, feature-tests) + clangwalk + ktlintCheck
        run: |
          # shellcheck disable=SC2046,SC2086 # one task per module
          ./gradlew --no-daemon $(printf ':%s:nativeTest ' $TEST_MODULES) ktlintCheck \
            :clangwalk:runDebugExecutableKlinker :verifyWorkflowPaths

      # #276: konan-cache's init script fails the build on a KGP version it did not key on.
      # This catches the rest: KGP provisioning that version somewhere other than the home the
      # action checks, which would leave the cache silently unused.
      - name: Assert KGP provisioned the version the cache is keyed on
        env:
          KONAN_HOME: ${{ steps.konan.outputs.home }}
        run: |
          if [ ! -f "$KONAN_HOME/provisioned.ok" ]; then
            found=(~/.konan/kotlin-native-prebuilt-*)
            echo "::error::KGP did not provision $KONAN_HOME; it provisioned ${found[*]}. Point konan-cache at the Kotlin version the build really uses."
            exit 1
          fi

      # A green Gradle invocation is not evidence tests ran: a task-name typo, a NO-SOURCE
      # source set, or an up-to-date task all report success having executed nothing (#198).
      # Per module, so one suite cannot silently drop out behind the others' total.
      - name: Assert the tests actually ran
        if: always()
        run: bash .github/test-evidence-gate/gate.sh assert "$TEST_MODULES"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: root-build-unit-test-results
          path: ./*/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  generator-suite:
    name: featuregen / cppfixture + the #101 determinism lock
    runs-on: ubuntu-latest
    # This job builds the in-tree tool: a K/N RELEASE link of the LLVM-linked :krapper binary,
    # then two full parse+generate+wrapper-compile cycles through it. Substantially slower than
    # the other job, hence the wider cap — still far under GitHub's 360-minute default, which
    # would let a wedged run sit for six hours (#198).
    timeout-minutes: 90
    env:
      # compiler/plugin is the #237 spelling gate's module; the rest are root-build modules
      # whose nativeTest the step below runs.
      TEST_MODULES: featuregen cppfixture compiler/plugin
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle's dependency cache
        uses: ./.github/actions/gradle-cache
        with:
          name: root-generator-suite

      - name: Cache the Kotlin/Native distribution
        id: konan
        uses: ./.github/actions/konan-cache

      - name: Install LLVM/Clang 22 (apt.llvm.org)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg ca-certificates software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          sudo ln -sf "$(command -v clang++-22)"     /usr/local/bin/clang++
          sudo ln -sf "$(command -v clang-22)"       /usr/local/bin/clang
          sudo ln -sf "$(command -v llvm-config-22)" /usr/local/bin/llvm-config
          echo "clang++: $(clang++ --version | head -1); llvm-config: $(llvm-config --version)"
          echo "CPATH=$(llvm-config --includedir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Clear stale test reports
        run: bash .github/test-evidence-gate/gate.sh clear "$TEST_MODULES"

      # `:krapper:noncopyableDeterminismCheck` is the #101 lock. It is now a `dependsOn` of
      # `:krapper:check`, but naming it explicitly here keeps it a first-class, named step of
      # this job rather than something that happens to be dragged in — and it needs the release
      # binary the featuregen graph builds anyway, so it costs this job essentially nothing.
      # A non-zero exit from the tool fails the task (App.kt's exitProcess(1)).
      # `:feature-tests:matrixReport` (#223) re-stamps docs/features.md from :featuregen's results,
      # which this job already pays for, plus :feature-tests' (cheap; the other job gates them).
      # It fails on a failing, all-skipped or missing test itself; the next step fails on a
      # committed matrix that the tests no longer agree with.
      - name: nativeTest (featuregen, cppfixture) + noncopyableDeterminismCheck + matrixReport
        run: |
          # shellcheck disable=SC2046,SC2086 # one task per module
          ./gradlew --no-daemon $(printf ':%s:nativeTest ' ${TEST_MODULES% compiler/plugin}) \
            :krapper:noncopyableDeterminismCheck :feature-tests:matrixReport :verifyWorkflowPaths

      # #237, the SPELLING gate: featuregen's specs, spelled by the IN-TREE plugin's cppSpec, must
      # be keys of the index the step above just emitted through the IN-TREE krapper. Only this
      # job has that index; see compiler/plugin/build.gradle.kts for why it is not a root test.
      - name: Spelling gate (in-tree plugin vs the index the in-tree krapper emitted)
        run: |
          ./gradlew --no-daemon -p compiler :kplusplus-compiler-plugin:bindingIndexGate \
            :verifyWorkflowPaths -PworkflowPaths.workflow=root-build.yml

      - name: Assert docs/features.md matches the tests
        run: |
          if ! git diff --exit-code -- docs/features.md; then
            echo "::error::matrixReport changed docs/features.md: the committed Status column disagrees with the tests. Run ./gradlew :feature-tests:matrixReport and commit the result."
            exit 1
          fi

      # Same as the other job (#276).
      - name: Assert KGP provisioned the version the cache is keyed on
        env:
          KONAN_HOME: ${{ steps.konan.outputs.home }}
        run: |
          if [ ! -f "$KONAN_HOME/provisioned.ok" ]; then
            found=(~/.konan/kotlin-native-prebuilt-*)
            echo "::error::KGP did not provision $KONAN_HOME; it provisioned ${found[*]}. Point konan-cache at the Kotlin version the build really uses."
            exit 1
          fi

      # Same gate as the other job. The determinism check is NOT test-report-backed — it is an
      # Exec whose non-zero exit fails the Gradle task directly, so the build step is its verdict.
      - name: Assert the tests actually ran
        if: always()
        run: bash .github/test-evidence-gate/gate.sh assert "$TEST_MODULES"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: root-build-generator-suite-test-results
          path: ./*/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
