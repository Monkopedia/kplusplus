# Closes #222: the ROOT Gradle build ran in no workflow at all.
#
# #210 fixed this for the two published JVM coordinates (compiler-check.yml). This is the
# same hole one layer out and much larger: `krapper` (THE TOOL, whose binary is bundled into
# the published plugin), `krapper_model`, `featuregen` (docs/ARCHITECTURE.md calls it "the
# primary correctness harness"), `feature-tests` and `cppfixture` — 566 `@Test`s across 122
# files — plus every `ktlintCheck` the root build.gradle.kts configures, ran only when a human
# happened to run them locally. A PR touching only `featuregen/` or `krapper/src/nativeMain`
# triggered NO workflow and merged green having executed nothing. That is the direct cause of
# the pattern this repo keeps re-discovering after the fact: #16, #194, #195.
#
# WHY TWO JOBS. The split is the task graph's own, not an arbitrary one:
#
#   * `unit-tests` runs the suites that do NOT need the in-tree tool. `:krapper:nativeTest`
#     reaches `kplusplusSync` (its clang-AST bindings, generated by the tool bundled in the
#     LAST released plugin) and then a DEBUG test link — no release link. `:krapper_model` is
#     plain K/N, `:feature-tests` is plain cinterop over a clang++-compiled archive.
#   * `generator-suite` runs everything that goes through the IN-TREE tool. `:featuregen` and
#     `:cppfixture` are `kpp.frontend.*=cpp`, so their graphs pull
#     `:krapper:linkReleaseExecutableKlinker` — a full K/N RELEASE link of the LLVM-linked
#     binary, the single most expensive thing in the repo.
#
# So the second job is where the money is, and it is also why `:krapper:noncopyableDeterminismCheck`
# (the #101 lock, now a `dependsOn` of `:krapper:check` — krapper/build.gradle.kts) rides here:
# it needs that same release binary, which this job has already paid for. Running the two in
# parallel makes PR latency max(job), not sum(job).
#
# LLVM 22 is a HARD requirement of this build — settings.gradle.kts probes the toolchain
# UNCONDITIONALLY at settings-eval and fails fast if it is absent, so EVERY root Gradle
# invocation here needs it, `ktlintCheck` included. There is no `-PenableClang` flag; that
# opt-in was removed. The install block below is the one release.yml already uses.
name: root build

on:
  pull_request:
    paths:
      - 'krapper/**'
      - 'krapper_model/**'
      - 'featuregen/**'
      - 'feature-tests/**'
      - 'cppfixture/**'
      - 'clangwalk/**'          # in settings.gradle.kts, so ktlintCheck covers it
      - 'gradle/**'             # version catalog + the wrapper this runs
      - 'gradlew'
      - 'build.gradle.kts'      # configures ktlint across every subproject
      - 'settings.gradle.kts'   # the LLVM probe + the pinned consumed plugin version
      - 'gradle.properties'     # kpp.frontend.* per-module front ends, daemon heap
      # ktlint reads it, so it can fail every ktlintCheck in the build by itself: setting
      # max_line_length=40 fails :cppfixture:ktlintCheck in 6s, and without this line a PR
      # containing only that edit would trigger no workflow at all.
      - '.editorconfig'
      - '.github/workflows/root-build.yml'
  # Unfiltered on main, same as compiler-check.yml: a merge should always leave a full
  # root-build signal on the branch, whatever the merge happened to touch.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: krapper / krapper_model / feature-tests + ktlint
    runs-on: ubuntu-latest
    # No release link in this job's graph (see the header), but it is still a Kotlin/Native
    # compile plus a cinterop of the ~60-entry clang slice. Well past this and it is wedged,
    # not slow — the same reasoning as #198's cap on samples-minimal.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Kotlin/Native distribution is a ~1 GB download that is identical for every run of
      # a given Kotlin version, and it is the largest fixed cost in a cold root build. This is
      # first-party actions/cache, deliberately NOT gradle/actions/setup-gradle — whose v6
      # moved caching into a proprietary, non-MIT component that #209 has open pending the
      # owner (compiler-check.yml declines it for the same reason). A cache miss just means
      # the download happens.
      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Install LLVM/Clang 22 (apt.llvm.org)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg ca-certificates software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          sudo ln -sf "$(command -v clang++-22)"     /usr/local/bin/clang++
          sudo ln -sf "$(command -v clang-22)"       /usr/local/bin/clang
          sudo ln -sf "$(command -v llvm-config-22)" /usr/local/bin/llvm-config
          echo "clang++: $(clang++ --version | head -1); llvm-config: $(llvm-config --version)"
          echo "CPATH=$(llvm-config --includedir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      # Delete-before-measure (#198). A task that does not run leaves any previous report
      # exactly where the guard below looks, so "never ran" and "ran and passed" are
      # indistinguishable on disk. Nothing to delete on a fresh checkout; this matters on a
      # re-run of a cached workspace.
      - name: Clear stale test reports
        run: rm -rf ./*/build/test-results

      - name: nativeTest (krapper, krapper_model, feature-tests) + ktlintCheck
        run: >-
          ./gradlew --no-daemon
          :krapper:nativeTest :krapper_model:nativeTest :feature-tests:nativeTest
          ktlintCheck

      # A green Gradle invocation is not evidence tests ran: a task-name typo, a NO-SOURCE
      # source set, or an up-to-date task all report success having executed nothing, and the
      # JUnit XML from a PREVIOUS run persists where a verifier looks (#198). So: delete the
      # reports first (step above), then assert PER MODULE that each one produced a non-empty
      # report. Per-module matters here and did not in #198's single-module jobs — a whole
      # suite could silently drop out and the total would still be comfortably non-zero.
      - name: Assert the tests actually ran
        if: always()
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          grand=0
          for mod in krapper krapper_model feature-tests; do
            xml=("$mod"/build/test-results/**/*.xml)
            if [ ${#xml[@]} -eq 0 ]; then
              echo "::error::No JUnit XML under $mod/build/test-results — :$mod:nativeTest produced no report at all, so it cannot have run anything."
              exit 1
            fi
            total=0; failed=0
            for f in "${xml[@]}"; do
              t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc '0-9' || true)
              e=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc '0-9' || true)
              r=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | tr -dc '0-9' || true)
              total=$((total + ${t:-0}))
              failed=$((failed + ${e:-0} + ${r:-0}))
            done
            echo "$mod: $total test(s), $failed failure(s)/error(s) across ${#xml[@]} report file(s)"
            if [ "$total" -eq 0 ]; then
              echo "::error::$mod reported ZERO tests. This job would otherwise be green having run nothing — failing it explicitly."
              exit 1
            fi
            if [ "$failed" -ne 0 ]; then
              echo "::error::$mod reported test failures/errors in its JUnit XML."
              exit 1
            fi
            grand=$((grand + total))
          done
          echo "TOTAL: $grand test(s)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-build-unit-test-results
          path: ./*/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  generator-suite:
    name: featuregen / cppfixture + the #101 determinism lock
    runs-on: ubuntu-latest
    # This job builds the in-tree tool: a K/N RELEASE link of the LLVM-linked :krapper binary,
    # then two full parse+generate+wrapper-compile cycles through it. Substantially slower than
    # the other job, hence the wider cap — still far under GitHub's 360-minute default, which
    # would let a wedged run sit for six hours (#198).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Install LLVM/Clang 22 (apt.llvm.org)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget lsb-release gnupg ca-certificates software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          sudo ln -sf "$(command -v clang++-22)"     /usr/local/bin/clang++
          sudo ln -sf "$(command -v clang-22)"       /usr/local/bin/clang
          sudo ln -sf "$(command -v llvm-config-22)" /usr/local/bin/llvm-config
          echo "clang++: $(clang++ --version | head -1); llvm-config: $(llvm-config --version)"
          echo "CPATH=$(llvm-config --includedir)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Clear stale test reports
        run: rm -rf ./*/build/test-results

      # `:krapper:noncopyableDeterminismCheck` is the #101 lock. It is now a `dependsOn` of
      # `:krapper:check`, but naming it explicitly here keeps it a first-class, named step of
      # this job rather than something that happens to be dragged in — and it needs the release
      # binary the featuregen graph builds anyway, so it costs this job essentially nothing.
      # A non-zero exit from the tool fails the task (App.kt's exitProcess(1)).
      - name: nativeTest (featuregen, cppfixture) + noncopyableDeterminismCheck
        run: >-
          ./gradlew --no-daemon
          :featuregen:nativeTest :cppfixture:nativeTest
          :krapper:noncopyableDeterminismCheck

      # Same delete-before-measure guard as the other job (#198), per module. Note the
      # determinism check is NOT test-report-backed — it is an Exec whose non-zero exit fails
      # the Gradle task directly, so the step above is its whole verdict.
      - name: Assert the tests actually ran
        if: always()
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          grand=0
          for mod in featuregen cppfixture; do
            xml=("$mod"/build/test-results/**/*.xml)
            if [ ${#xml[@]} -eq 0 ]; then
              echo "::error::No JUnit XML under $mod/build/test-results — :$mod:nativeTest produced no report at all, so it cannot have run anything."
              exit 1
            fi
            total=0; failed=0
            for f in "${xml[@]}"; do
              t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc '0-9' || true)
              e=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc '0-9' || true)
              r=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | tr -dc '0-9' || true)
              total=$((total + ${t:-0}))
              failed=$((failed + ${e:-0} + ${r:-0}))
            done
            echo "$mod: $total test(s), $failed failure(s)/error(s) across ${#xml[@]} report file(s)"
            if [ "$total" -eq 0 ]; then
              echo "::error::$mod reported ZERO tests. This job would otherwise be green having run nothing — failing it explicitly."
              exit 1
            fi
            if [ "$failed" -ne 0 ]; then
              echo "::error::$mod reported test failures/errors in its JUnit XML."
              exit 1
            fi
            grand=$((grand + total))
          done
          echo "TOTAL: $grand test(s)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-build-generator-suite-test-results
          path: ./*/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
