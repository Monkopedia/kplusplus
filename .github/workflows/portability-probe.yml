name: Portability probe

# Empirically maps how portable a dynamically-linked cppfrontend binary is across
# Linux distros + LLVM versions (Model 1 distribution: ship a prebuilt binary that
# dynamic-links the consumer's LLVM). Phase 1 here is the gating step: prove
# cppfrontend even BUILDS on a stock GitHub runner, and record the exact shared-lib
# SONAMEs the resulting binary hard-requires. The distro run-matrix is added once
# this is green.
#
# Manual / branch-scoped only for now — this is exploratory, not a merge gate.
on:
  workflow_dispatch:
  push:
    branches:
      - "ci/portability-probe-**"

jobs:
  build:
    name: Build cppfrontend (LLVM ${{ matrix.llvm }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Phase 2 (build-compatibility probe): the committed seed Clang-AST
        # bindings were generated against LLVM 22's headers. Attempt building
        # them against a representative low/mid/current spread to learn whether a
        # non-22 major is a cheap rebuild (seed compiles) or needs regenerated
        # bindings (seed fails on renamed/removed AST API). fail-fast:false so
        # every major attempts even if one fails to compile.
        llvm: [19, 20, 21, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install LLVM/Clang ${{ matrix.llvm }} (apt.llvm.org)
        run: |
          set -euxo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ matrix.llvm }} all
          # apt.llvm.org installs versioned binaries (clang++-22, llvm-config-22);
          # the build's settings probe looks for bare `clang++` / `llvm-config` on
          # PATH (or -PllvmConfig). Expose unversioned names.
          sudo ln -sf "$(command -v clang++-${{ matrix.llvm }})" /usr/local/bin/clang++
          sudo ln -sf "$(command -v clang-${{ matrix.llvm }})"   /usr/local/bin/clang
          sudo ln -sf "$(command -v llvm-config-${{ matrix.llvm }})" /usr/local/bin/llvm-config
          echo "clang++:     $(clang++ --version | head -1)"
          echo "llvm-config: $(llvm-config --version)  libdir=$(llvm-config --libdir)"
          # The committed seed wrapper (#include <clang/AST/...>) is compiled with only
          # `-I krapped`; it assumes the Clang/LLVM headers are on the default include
          # path (true on Arch, our dev box). apt.llvm.org installs them under
          # /usr/lib/llvm-<v>/include, so surface that via CPATH (honored by clang) to
          # every compile in the build — no plugin change needed.
          echo "CPATH=$(llvm-config --includedir)" >> "$GITHUB_ENV"
          # Runtime: let the freshly-built binary find libLLVM/libclang-cpp for the
          # inspect step (they live in the versioned libdir, not a default -L path).
          echo "LD_LIBRARY_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      # Probe 2 build-compatibility diagnostic: run the SEED WRAPPER COMPILE
      # directly, ahead of Gradle, mirroring the exact command the
      # :cppfrontend:kplusplusSync task issues (KPlusPlusCompilerGradlePlugin.kt:
      # clang++ -std=c++17 -c -fPIE -I krapped -DV8_COMPRESS_POINTERS
      # cppfrontend.cc). The seed's Clang-AST bindings were generated against LLVM
      # 22's headers; this surfaces the raw clang++ diagnostic (Gradle's inheritIO
      # buffering can drop it from the CI log) so a non-22 compile FAILURE shows its
      # root cause (renamed/removed AST API) directly. Non-fatal — the Gradle build
      # below is still the job's real pass/fail gate; this only captures the WHY.
      - name: Seed compile diagnostic (raw clang++ on cppfrontend.cc)
        run: |
          set -uxo pipefail
          KR=cppfrontend/krapped
          echo "### Seed wrapper compile against LLVM ${{ matrix.llvm }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set +e
          # -ferror-limit=0: capture the COMPLETE error set (no cap) so the full
          # cross-major drift can be measured, not just the first handful.
          clang++ -std=c++17 -fsyntax-only -fPIE -ferror-limit=0 \
            -I"$KR" -DV8_COMPRESS_POINTERS "$KR/cppfrontend.cc" \
            > seed-compile.out 2>&1
          rc=$?
          echo "clang++ exit=$rc" | tee -a "$GITHUB_STEP_SUMMARY"
          nerr=$(grep -c -E 'error:' seed-compile.out)
          echo "distinct 'error:' lines = $nerr" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "-- errors --" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E 'error:' seed-compile.out | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "seed compiles clean against LLVM ${{ matrix.llvm }}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Always print the full diagnostic to the raw log for the record.
          echo "===== full clang++ output ====="
          cat seed-compile.out
          exit 0

      - name: Upload seed-compile diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: seed-compile-llvm${{ matrix.llvm }}
          path: seed-compile.out
          if-no-files-found: error

      # The non-22 matrix cells exist only to capture the seed-compile diagnostic
      # above; the heavy Gradle build/inspect/upload only needs to run for the
      # baseline (22) cell. Gating them keeps the non-22 cells fast (diagnostic-only)
      # and avoids wasting builder time on majors whose seed won't compile anyway.
      - name: Build cppfrontend (release, klinker)
        if: ${{ matrix.llvm == 22 }}
        run: |
          set -euxo pipefail
          ./gradlew :cppfrontend:linkReleaseExecutableKlinker -PenableClang \
            --no-daemon --stacktrace

      - name: Inspect the binary — the actual portability contract
        if: ${{ matrix.llvm == 22 }}
        run: |
          set -euxo pipefail
          BIN=cppfrontend/build/bin/klinker/cppfrontendRelease/cppfrontend
          test -f "$BIN"
          echo "## cppfrontend built against LLVM ${{ matrix.llvm }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "== NEEDED (hard-required SONAMEs) ==" | tee -a "$GITHUB_STEP_SUMMARY"
          readelf -d "$BIN" | grep NEEDED | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== ldd (resolved on this builder) ==" | tee -a "$GITHUB_STEP_SUMMARY"
          ldd "$BIN" | grep -iE 'llvm|clang|stdc' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cppfrontend binary
        if: ${{ matrix.llvm == 22 }}
        uses: actions/upload-artifact@v4
        with:
          name: cppfrontend-llvm${{ matrix.llvm }}
          path: cppfrontend/build/bin/klinker/cppfrontendRelease/cppfrontend
          if-no-files-found: error

  # Phase 1 run-matrix (UNCHANGED): take the LLVM-22 binary and see which
  # {distro × LLVM} environments can actually load + start it. Probe 2 does not
  # re-open the run/load question (Phase 1 already established the SONAME-match
  # load rule), so this stays pinned to the llvm-22 artifact — it exists as long
  # as the matrix.llvm==22 build cell passes. The 18/20 build cells feed the
  # build-compatibility finding only; they are not run here.
  # Driven via `docker run` from the host (not GH `container:`) so musl/Alpine and
  # node-less images work, and one binary is tested everywhere. Each cell PRINTS a
  # RESULT line (data, not a job failure), so the workflow stays green regardless
  # of load outcome.
  run-matrix:
    name: Run — ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # apt.llvm.org LLVM 22 (upstream SONAME libLLVM.so.22.1) across Debian-family
          # bases of varying glibc/libstdc++ age — expected PASS, tests the runtime floor.
          - name: "ubuntu-24.04 + llvm.org 22"
            image: "ubuntu:24.04"
            llvm_install: "apt-get update && apt-get install -y wget lsb-release gnupg ca-certificates binutils software-properties-common && wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && chmod +x /tmp/llvm.sh && /tmp/llvm.sh 22"
          - name: "ubuntu-22.04 + llvm.org 22"
            image: "ubuntu:22.04"
            llvm_install: "apt-get update && apt-get install -y wget lsb-release gnupg ca-certificates binutils software-properties-common && wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && chmod +x /tmp/llvm.sh && /tmp/llvm.sh 22"
          - name: "debian-12 + llvm.org 22"
            image: "debian:12"
            llvm_install: "apt-get update && apt-get install -y wget lsb-release gnupg ca-certificates binutils software-properties-common && wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && chmod +x /tmp/llvm.sh && /tmp/llvm.sh 22"
          # Native distro LLVM — different majors + different SONAME conventions.
          - name: "archlinux + native llvm (~22)"
            image: "archlinux:latest"
            llvm_install: "pacman -Sy --noconfirm llvm clang binutils"
          - name: "fedora-41 + native llvm (~19)"
            image: "fedora:41"
            llvm_install: "dnf install -y llvm-libs clang-libs libclang-cpp binutils findutils || dnf install -y llvm clang binutils findutils"
          - name: "rockylinux-9 + native llvm"
            image: "rockylinux:9"
            llvm_install: "dnf install -y llvm-libs clang binutils findutils || dnf install -y llvm clang binutils findutils"
          # musl boundary — glibc binary can't run here; documents the edge.
          - name: "alpine (musl boundary)"
            image: "alpine:latest"
            llvm_install: "apk add --no-cache llvm-libs clang binutils || true"
    steps:
      - uses: actions/checkout@v4

      - name: Download cppfrontend binary (built against LLVM 22)
        uses: actions/download-artifact@v4
        with:
          name: cppfrontend-llvm22
          path: bin

      - name: Probe ${{ matrix.name }}
        run: |
          set -uxo pipefail
          chmod +x bin/cppfrontend .github/probe/run-in-container.sh
          docker run --rm \
            -e LLVM_INSTALL="${{ matrix.llvm_install }}" \
            -e IMAGE_NAME="${{ matrix.name }}" \
            -v "$PWD/bin/cppfrontend:/probe/cppfrontend:ro" \
            -v "$PWD/.github/probe/run-in-container.sh:/run.sh:ro" \
            "${{ matrix.image }}" sh /run.sh 2>&1 | tee probe-out.txt
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^RESULT=' probe-out.txt >> "$GITHUB_STEP_SUMMARY" || echo "RESULT=unknown (no RESULT line — see logs)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
