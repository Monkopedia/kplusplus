version=0.3.2
group=com.monkopedia.kplusplus
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Release signing (Central Portal). Publications are GPG-signed via com.vanniktech.maven.
# publish's `signAllPublications()`, which reads an IN-MEMORY key + passphrase from the
# environment (ORG_GRADLE_PROJECT_signingInMemoryKey / ...Password). The release workflow
# (.github/workflows/release.yml) supplies these from the SIGNING_KEY / SIGNING_PASSWORD
# GitHub Secrets — see docs/releasing.md. Deliberately NOT set here (no committed
# signing.gnupg.keyName): its mere presence activates a gnupg signatory that makes local,
# unsigned `publishToMavenLocal` fail with "no configured signatory". The legacy v1 GPG key
# was 5B83421E2338B907; export the same key material into the in-memory secrets for CI.

# Gradle daemon heap (#83). Kotlin/Native compiles + LINKS in-process inside the Gradle
# daemon, so the DAEMON heap below — NOT GRADLE_OPTS, which does not reach the in-process
# K/N compiler — is what governs OOM on the link. Gradle's stock 512m default OOMs the K/N
# release link, which previously forced a manual per-build heap workaround. 6g reliably
# builds the default (LLVM-free) gate AND the gated cpp front-end (-PenableClang) here; the
# heaviest gated release links (cpp/clang under -PenableClang) may want more — raise this
# line, or ~/.gradle/gradle.properties, to -Xmx8g/12g. See docs/clang-runbook.md.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Phase E step 3 (#47, flip brick B3) — PERSISTENT per-module front-end defaults.
#
# These make each binding-generating consumer build OFF the in-tree libclang front-end BY
# DEFAULT (no -P flag), so brick B5 can delete libclang cleanly. The kplusplus plugin reads
# `kpp.frontend.<module>`: absent => libclang (the pre-B3 default), `cpp` => generate via the
# gated :krapper_parse (LLVM-mandatory), `seed` => build from the module's COMMITTED stage-0
# seed (no krapper_gen, no libclang — just a plain C++ recompile of the committed wrapper).
# Revert a flip by deleting/emptying its line (`-Pkpp.frontend.<m>=` overrides to libclang).
#
# cpp (cpp-parseable today — LLVM/-PenableClang REQUIRED, the intended LLVM-mandatory end-state):
kpp.frontend.featuregen=cpp
kpp.frontend.cppfixture=cpp
# krapper_parse SELF-HOSTS: regenerates its own bindings by parsing its headers with the
# krapper_parse binary bundled in the last published release's plugin (pluginManagement pins the
# version in settings.gradle.kts). The committed seed was retired in #144 (there is no
# krapper_parse/krapped anymore).
kpp.frontend.krapper_parse=cpp
# seed (committed stage-0 seed): clangwalk is a dev-only self-hosting demo, not part of the release.
kpp.frontend.clangwalk=seed
