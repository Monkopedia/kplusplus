kotlin.native.cacheKind.linuxX64=none
org.gradle.jvmargs=-Xmx4096m
# Self-host the v8 bindings through the cpp front-end (built on generated libclang-cpp
# bindings). Requires an LLVM 22 toolchain on the box (this sample includeBuilds the main
# kplusplus build, whose settings-eval fails fast if LLVM is absent).
kpp.frontend.v8=cpp