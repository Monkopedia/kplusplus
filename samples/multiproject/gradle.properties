org.gradle.jvmargs=-Xmx4096m
# The single custom native target is named "native", which clashes with the source sets the
# default hierarchy template creates; this sample doesn't use them (mirrors samples/minimal).
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Generate the bindings through the cpp front-end. The key is the PROJECT name — `bindings`,
# the subproject that applies the plugin, not the root. The krapper tool binary comes from the
# bundled plugin jar; it is LLVM-linked, so an LLVM/Clang toolchain must be on PATH at runtime.
kpp.frontend.bindings=cpp
