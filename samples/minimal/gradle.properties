kotlin.native.cacheKind.linuxX64=none
org.gradle.jvmargs=-Xmx4096m
# Self-host the geometry bindings through the cpp front-end (built on generated
# libclang-cpp bindings). As a from-published consumer (R2, #128) the krapper_parse
# tool binary is resolved by coordinate from mavenLocal (or the bundled plugin jar) —
# there are NO in-tree clang modules here, so this consumer never evaluates the kplusplus
# root build's LLVM-requiring settings. The published krapper_parse is LLVM-linked and
# needs an LLVM/Clang toolchain present at RUNTIME (clang++ on PATH).
# The property key is this project's rootProject.name (minimal).
kpp.frontend.minimal=cpp
